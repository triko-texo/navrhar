<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Návrhář potisku – prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Anton&family=Archivo+Black&family=Playfair+Display:wght@400;700&family=Lobster&family=Pacifico&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Amatic+SC:wght@400;700&family=Bangers&family=Fredoka:wght@400;700&family=Righteous&family=Russo+One&family=Lilita+One&family=Courgette&family=Press+Start+2P&display=swap">
<style>
:root{--bg:#eef0f2;--card:#fff;--tx:#16181d;--mu:#5d6370;--ac:#0a7d6e;--acx:#fff;--bd:#d5d9df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1f2228;--tx:#eef0f3;--mu:#9aa1ad;--ac:#2fc3ad;--acx:#06201b;--bd:#363b44}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1f2228;--tx:#eef0f3;--mu:#9aa1ad;--ac:#2fc3ad;--acx:#06201b;--bd:#363b44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 2px}h2{font-size:13px;margin:10px 0 4px;color:var(--mu);font-weight:600}
.app{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;padding:12px;max-width:1120px;margin:auto}
.app>section:nth-child(2){padding:10px}
.bar{grid-column:1/-1;position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;box-shadow:0 -4px 14px rgba(0,0,0,.14)}.bar .sizes{grid-template-columns:repeat(8,36px);gap:4px}.bar .sizes label{font-size:11px}.bar .sizes input{padding:4px 2px}.bar .price{font-size:20px;line-height:1.2}.bar .bpr{flex:1 1 110px}.bar .bact{flex:0 0 150px}

@media(max-width:639px){.app{grid-template-columns:1fr}.app>section:nth-child(2){padding:14px}.bar{position:static}.bar .bsz{flex:1 1 100%}.bar .sizes{grid-template-columns:repeat(4,1fr)}.bar .bact{flex:1 1 100%}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.main{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;width:100%;padding:11px}
input[type=text],select{width:100%;box-sizing:border-box;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>button{flex:1 1 auto}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.filebtn{display:block;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--card)}.filebtn:hover{border-color:var(--ac)}#file:focus-visible+.filebtn{outline:2px solid var(--ac);outline-offset:2px}.row>.sw{flex:0 0 26px}.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--bd)}.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.wrap{overflow:hidden}#stage{position:relative;width:480px;height:520px;margin:0 auto;transform-origin:0 0}
#shirt{position:absolute;inset:0}#cv-box{position:absolute;inset:0}
.zone{position:absolute;border:1.5px dashed var(--ac);border-radius:4px;pointer-events:none;font-size:11px;color:var(--ac);padding:1px 3px;box-sizing:border-box}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sizes label{font-size:12px;color:var(--mu);text-align:center}
.sizes input{width:100%;box-sizing:border-box;padding:5px;text-align:center;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
.price{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}#msg{min-height:20px;font-size:13px;margin-top:8px;color:var(--ac)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}#modal[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{padding:3px 10px;border-radius:99px;font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}#grid button{padding:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff}#grid img{max-width:100%;max-height:100%}
</style></head><body>
<div class="app">
 <section class="card">
  <h1>Návrhář potisku</h1><div class="mu">Pánské tričko (prototyp) · verze 7</div>
  <h2>Barva trička</h2><div class="row" id="cols"></div>
  <h2>Text</h2>
  <input type="text" id="txt" placeholder="Váš text" aria-label="Text potisku">
  <div class="row"><select id="font" aria-label="Písmo" style="flex:2"><option>Arial</option><option>Georgia</option><option>Impact</option><option>Courier New</option><option>Trebuchet MS</option></select><input type="color" id="tcol" value="#000000" aria-label="Barva textu" style="flex:1;height:36px"></div>
  <button id="addTxt" style="width:100%">Přidat text</button>
  <h2>Obrázek</h2>
  <input type="file" id="file" class="sr" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"><label for="file" class="filebtn">Nahrát obrázek</label>
  <h2>Motivy</h2><button id="openM" style="width:100%">Vyhledat motiv</button>
  <div id="msg" role="status"></div>
 </section>
 <section class="card">
  <div class="tabs"><button id="tf" class="on">Přední strana</button><button id="tb">Zadní strana</button></div>
  <div class="wrap" id="sw"><div id="stage">
   <svg id="shirt" viewBox="0 0 480 520" aria-hidden="true"><path id="body" stroke="rgba(0,0,0,.25)" stroke-width="2" stroke-linejoin="round"/></svg>
   <div id="cv-box"><canvas id="c" width="480" height="520"></canvas></div>
   <div id="zones"></div>
  </div></div>
  <h2>Umístit vybraný prvek do zóny</h2><div class="row" id="zb"></div><div class="row" style="margin-top:8px"><button id="dl">Stáhnout potisk (PNG)</button><button id="del">Smazat prvek</button></div>
  <p class="mu">Klikněte na prvek a táhněte ho myší. Rohy mění velikost, kroužek nad prvkem ho otáčí.</p>
 </section>
 <div class="bar card">
  <div class="bsz"><div class="sizes" id="sizes"></div></div>
  <div class="bpr"><div class="mu">Za kus: <b id="unit">–</b> <span id="info"></span></div><div class="price" id="total">–</div></div>
  <div class="bact"><button class="main" id="cart">Přidat do košíku</button></div>
 </div>
</div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-label="Motivy">
 <div class="mhead"><b>Motivy</b><button id="mx" aria-label="Zavřít">Zavřít</button></div>
 <div class="tabs"><button id="tEmo" class="on">Emotikony</button><button id="tSym">Symboly (jedna barva)</button></div>
 <div class="row"><input type="text" id="q" placeholder="Hledejte anglicky, např. heart, beer, dog" style="flex:1 1 200px;margin:0"><button id="qgo" style="flex:0 0 auto">Hledat</button></div>
 <div class="chips" id="chips"></div>
 <div id="symcol" class="mu" hidden>Barva symbolu: <input type="color" id="scol" value="#000000" aria-label="Barva symbolu"></div>
 <div id="grid"></div><div class="row"><button id="more" hidden>Zobrazit další</button></div><div class="mu" id="mmsg" role="status"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
// ===== NASTAVENÍ (upravte podle sebe) =====
const CFG={base:159,perSide:49,discounts:[[50,0.15],[10,0.08]]};
const COLORS=["#e9e9ec","#8a8a8f","#3b3b40","#000000","#ffffff","#c8102e","#ff7a00","#ffd400","#2aa84a","#1f6fd1","#0b2a5b","#d6006f","#7a4a2b","#6a2c91"];
const SIZES=["XS","S","M","L","XL","2XL","3XL","4XL"];
const EMO=["😀","😎","❤️","⭐","🔥","🎉","🏆","🐾"];
// Zóny potisku v souřadnicích plátna 480×520
const ZONES={chest:{s:"front",x:272,y:112,w:62,h:62,n:"Prso"},front:{s:"front",x:150,y:120,w:180,h:200,n:"Předek"},full:{s:"front",x:135,y:100,w:210,h:360,n:"Celopotisk"},back:{s:"back",x:150,y:110,w:180,h:220,n:"Záda"},hem:{s:"back",x:150,y:400,w:180,h:60,n:"Vzadu nad lem"}};
const PATH={front:"M150 40 L100 60 L20 140 L70 200 L120 165 L120 480 L360 480 L360 165 L410 200 L460 140 L380 60 L330 40 Q240 110 150 40 Z",back:"M150 40 L100 60 L20 140 L70 200 L120 165 L120 480 L360 480 L360 165 L410 200 L460 140 L380 60 L330 40 Q240 62 150 40 Z"};
const $=id=>document.getElementById(id);
const cv=new fabric.Canvas("c",{preserveObjectStacking:true});
let side="front",data={front:null,back:null},color=COLORS[0];
const say=t=>{$("msg").textContent=t};
function drawShirt(){$("body").setAttribute("d",PATH[side]);$("body").style.fill=color;
 $("zones").innerHTML=Object.values(ZONES).filter(z=>z.s===side).map(z=>`<div class="zone" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px">${z.n}</div>`).join("");
 $("tf").classList.toggle("on",side==="front");$("tb").classList.toggle("on",side==="back");
 $("zb").innerHTML="";Object.entries(ZONES).forEach(([k,z])=>{const b=document.createElement("button");b.textContent=z.n;b.onclick=()=>place(k);$("zb").appendChild(b)});}
function other(){return side==="front"?"back":"front"}
function switchSide(s){if(s===side)return;data[side]=JSON.stringify(cv.toJSON());cv.clear();side=s;
 if(data[s])cv.loadFromJSON(data[s],()=>{cv.renderAll();price()});else price();drawShirt();}
function sidesUsed(){let n=cv.getObjects().length?1:0;if(data[other()]&&JSON.parse(data[other()]).objects.length)n++;return n}
function qty(){return [...document.querySelectorAll(".sizes input")].reduce((a,i)=>a+(parseInt(i.value)||0),0)}
function price(){const q=qty(),u=CFG.base+CFG.perSide*sidesUsed();let d=0;for(const[m,p]of CFG.discounts){if(q>=m){d=p;break}}
 const unit=Math.round(u*(1-d));$("unit").textContent=unit+" Kč";$("info").textContent="· "+(sidesUsed()===0?"bez potisku":sidesUsed()===1?"1 potištěná strana":sidesUsed()+" potištěné strany")+(d?`, sleva ${d*100} %`:"");$("total").textContent=(unit*q)+" Kč ("+q+" ks)";}
function add(o){o.set({originX:"center",originY:"center",left:240,top:230});cv.add(o);cv.setActiveObject(o);cv.requestRenderAll();price()}
function place(k){const z=ZONES[k],o=cv.getActiveObject();if(!o){say("Nejdřív vyberte text nebo obrázek na tričku.");return}
 if(z.s!==side){cv.remove(o);switchSide(z.s);cv.add(o)}
 o.scale(Math.min(z.w/o.width,z.h/o.height));o.setPositionByOrigin(new fabric.Point(z.x+z.w/2,z.y+z.h/2),"center","center");o.setCoords();cv.setActiveObject(o);cv.requestRenderAll();price();say("Umístěno: "+z.n)}
// Ovládací prvky
COLORS.forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===color?" on":"");b.style.background=c;b.setAttribute("aria-label","Barva "+c);
 b.onclick=()=>{color=c;document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));b.classList.add("on");drawShirt()};$("cols").appendChild(b)});

SIZES.forEach(s=>{const l=document.createElement("label");l.innerHTML=`${s}<input type="number" min="0" value="${s==="M"?1:0}" aria-label="Počet ${s}">`;l.querySelector("input").oninput=price;$("sizes").appendChild(l)});
$("addTxt").onclick=()=>{const f=$("font").value;useFont(f,()=>add(new fabric.IText($("txt").value||"Váš text",{fontFamily:f,fill:$("tcol").value,fontSize:36})))};
$("tcol").oninput=()=>{const o=cv.getActiveObject();if(o&&o.type==="i-text"){o.set("fill",$("tcol").value);cv.requestRenderAll()}};
$("font").onchange=()=>{const o=cv.getActiveObject(),f=$("font").value;if(o&&o.type==="i-text")useFont(f,()=>{o.set("fontFamily",f);o.initDimensions();o.setCoords();cv.requestRenderAll()})};
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024){say("Soubor je větší než 25 MB. Zvolte menší soubor.");e.target.value="";return}const r=new FileReader();r.onload=()=>fabric.Image.fromURL(r.result,img=>{
 if(img.width<1000)say("Obrázek má jen "+img.width+" px na šířku. Pro kvalitní tisk doporučujeme alespoň 1000 px.");else say("Obrázek nahrán ("+img.width+" px).");
 img.scale(Math.min(160/img.width,160/img.height));add(img)});r.readAsDataURL(f);e.target.value=""};
$("del").onclick=()=>{cv.getActiveObjects().forEach(o=>cv.remove(o));cv.discardActiveObject();cv.requestRenderAll();price()};
document.addEventListener("keydown",e=>{if(e.key==="Delete"&&document.activeElement.tagName!=="INPUT")$("del").click()});
$("tf").onclick=()=>switchSide("front");$("tb").onclick=()=>switchSide("back");
$("dl").onclick=()=>{cv.discardActiveObject();cv.renderAll();const a=document.createElement("a");a.href=cv.toDataURL({format:"png",multiplier:3});a.download="potisk-"+(side==="front"?"predek":"zada")+".png";a.click();say("Staženo. Zadní a přední stranu stáhněte zvlášť.")};
$("cart").onclick=()=>say("Ukázka: tady se později odešle objednávka do košíku Shoptetu ("+qty()+" ks, "+$("total").textContent+").");
// ===== Písma (Google Fonts, podpora češtiny ověřte vzorkem textu) =====
const FONTS=["Arial","Georgia","Impact","Courier New","Roboto","Open Sans","Montserrat","Oswald","Anton","Archivo Black","Playfair Display","Lobster","Pacifico","Dancing Script","Caveat","Amatic SC","Bangers","Fredoka","Righteous","Russo One","Lilita One","Courgette","Press Start 2P"];
$("font").innerHTML="";FONTS.forEach(f=>{const o=document.createElement("option");o.textContent=f;o.style.fontFamily=f;$("font").appendChild(o)});
function useFont(f,cb){(document.fonts&&document.fonts.load?document.fonts.load('36px "'+f+'"'):Promise.resolve()).then(cb,cb)}
// ===== Motivy (Iconify API: emotikony Noto a Fluent, symboly MDI a Tabler) =====
const API="https://api.iconify.design",SETS={emo:"noto,fluent-emoji-flat",sym:"mdi,tabler"};
const CHIPS=[["Smajlíci","face"],["Srdce","heart"],["Hvězdy","star"],["Zvířata","animal"],["Pes","dog"],["Kočka","cat"],["Jídlo","food"],["Pivo","beer"],["Sport","sport"],["Hudba","music"],["Oslava","party"],["Auto","car"],["Příroda","tree"],["Děti","baby"],["Láska","love"],["Koruna","crown"]];
let mode="emo",res=[],shown=0;
function iurl(id){const a=id.split(":"),c=mode==="sym"?"&color="+encodeURIComponent($("scol").value):"";return API+"/"+a[0]+"/"+a[1]+".svg?height=512"+c}
function render(){const part=res.slice(shown,shown+48);part.forEach(id=>{const b=document.createElement("button"),im=new Image();im.src=iurl(id);im.alt=id.split(":")[1];im.loading="lazy";b.appendChild(im);b.onclick=()=>addIcon(id);$("grid").appendChild(b)});shown+=part.length;$("more").hidden=shown>=res.length}
function search(q){$("mmsg").textContent="Hledám…";$("grid").innerHTML="";res=[];shown=0;$("more").hidden=true;
 fetch(API+"/search?query="+encodeURIComponent(q)+"&limit=96&prefixes="+SETS[mode]).then(r=>r.json()).then(d=>{res=d.icons||[];$("mmsg").textContent=res.length?"":"Nic nenalezeno. Zkuste anglické slovo.";render()}).catch(()=>{$("mmsg").textContent="Hledání se nepodařilo. Zkontrolujte připojení a zkuste to znovu."})}
function addIcon(id){fabric.Image.fromURL(iurl(id),img=>{if(!img||!img.width){say("Motiv se nepodařilo načíst.");return}img.scaleToWidth(110);add(img);$("modal").hidden=true;say("Motiv přidán.")},{crossOrigin:"anonymous"})}
function setMode(m){mode=m;$("tEmo").classList.toggle("on",m==="emo");$("tSym").classList.toggle("on",m==="sym");$("symcol").hidden=m!=="sym";search($("q").value||(m==="emo"?"smile":"star"))}
CHIPS.forEach(c=>{const b=document.createElement("button");b.textContent=c[0];b.onclick=()=>{$("q").value=c[1];search(c[1])};$("chips").appendChild(b)});
$("openM").onclick=()=>{$("modal").hidden=false;if(!res.length)search(mode==="emo"?"smile":"star");$("q").focus()};
$("mx").onclick=()=>{$("modal").hidden=true};$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").hidden=true});
$("qgo").onclick=()=>search($("q").value||"smile");$("q").onkeydown=e=>{if(e.key==="Enter")$("qgo").click()};
$("more").onclick=render;$("tEmo").onclick=()=>setMode("emo");$("tSym").onclick=()=>setMode("sym");
$("scol").oninput=()=>{$("grid").innerHTML="";shown=0;render()};
cv.on("object:modified",price);drawShirt();price();
// Zmenší náhled trička, aby se vešel do úzkého okna (telefon, úzký sloupec e-shopu)
function fit(){const w=$("sw").clientWidth,wide=matchMedia("(min-width:640px)").matches;let k=Math.min(1,w/480);if(wide)k=Math.min(k,Math.max(.6,(innerHeight-370)/520));$("stage").style.transformOrigin=w<480?"0 0":"50% 0";$("stage").style.transform=k<1?"scale("+k+")":"none";$("sw").style.height=(520*k)+"px";cv.calcOffset()}
if(window.ResizeObserver)new ResizeObserver(fit).observe($("sw"));window.addEventListener("resize",fit);fit();
</script></body></html>
